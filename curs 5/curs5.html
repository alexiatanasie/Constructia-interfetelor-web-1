<!-- construirea strucutrii de baza a unui tabel html(<table> <tr> <th> <td>)
    table - elementul de baza pentru crearea unui tabel
    tr - table row - rand de tabel
    th - table header - celula de antet a tabelului
    td - table data - celula de date a tabelului
    //table data celule care vor face parte din corpul tabelelor

    aplicarea elementelor de grupare :  <thead> <tbody> <tfoot>
    //thead - gruparea antetului tabelului
    //tbody - gruparea corpului tabelului
    //tfoot - gruparea subsolului tabelului
    utilizarea atributelor de formare si structurare a tabelelor: border, colspan, rowspan
    //border - pentru a adauga o margine in jurul tabelului si celulelor
    //colspan - pentru a face o celula sa se intinda pe mai multe coloane
    //rowspan - pentru a face o celula sa se intinda pe mai multe randuri
 introducerea unor randuri reunite merge pe mai multe coloane cu numele grupei
 introducerea unor coloane reunite merge pe mai multe randuri cu numele semi-grupei
    border collapse sa nu mai fie spatiu pe border
     -->



<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog cu studenti</title>
</head>

<body>
    <table style="border: 1px solid rgb(239, 239, 43);width: 100%; border-collapse: collapse;" border="1">
        <thead style="background-color: bisque;">
        <tr>
            <th colspan="2">Student

            </th>
            <th>

            </th>

            <th colspan="3">
                Note
            </th>

        </tr>

        <tr>
            <!--celulele cu numele tabelului //Table header-->
            <th style="border: 1px solid red;">Nume</th>
            <th>Prenume</th>
            <th>Semi-grupa</th>
            <th>Nota curs</th>
            <th>Nota parcurs</th>
            <th>Nota examen</th>
        </tr>
        </thead>
         <tbody style="background-color:chartreuse ;">
       
        <tr style="background-color: lavender;">    
            <td colspan="6" style="text-align: center;color:firebrick">
            <!--;  reprezinta ca pot sa pun si altceva dupa -->
                <b> Semigrupa 414Ha</b>
            </td>
        </tr>
        <tr>
            <td>Popescu</td>
            <td>Ion</td>
            <td rowspan="2">414Ha</td>
            <td>9.20</td>
            <td>8.60</td>
            <td>10</td>
        </tr>

        <tr>
            <td>Georgescu</td>
            <td>Andrei</td>
            <td>8.50</td>
            <td>7.80</td>
            <td>8.00</td>
        </tr>
        <tr style="background-color: blueviolet;">    
            <td colspan="6" style="text-align: center;color:firebrick">
            <!-- ; reprezinta ca pot sa pun si altceva dupa -->
                <b> Semigrupa 414Hb</b>
            </td>
        </tr>
        <tr>
            <td>Marinescu</td>
            <td>Elena</td>
            <td rowspan="2">414Hb</td>
            <td>10</td>
            <td>9.50</td>
            <td>9.80</td>
        </tr>
        <tr>
            <td>Ionescu</td>
            <td>Maria</td>
            <td>9.80</td>
            <td>9.00</td>
            <td>9.50</td>
        </tr>
       </tbody>
        <tfoot style="background-color: aqua;">
        <tr>

            <td colspan="3" style="text-align: right;">Medie</td>
            <td>8.00</td>
            <td>9.50</td>
            <td>9.80</td>
        </tr>
        </tfoot>
    </table>
</body>

</html>
